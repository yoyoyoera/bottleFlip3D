<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bottle Flip 3D</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <!-- 메인 메뉴: 왼쪽 메뉴, 오른쪽에 내 물병 -->
    <div id="menu" class="menu">
      <h1>Bottle Flip <span>3D</span></h1>
      <button data-act="practice" class="primary">연습 <small>혼자 무한으로 던지기</small></button>
      <button data-act="local">멀티 (한 PC) <small>2~4명이 번갈아 던지기</small></button>
      <button data-act="join" disabled>Join <small>코드 입력 · 온라인 준비 중</small></button>
      <button data-act="host" disabled>Host <small>방 만들기 · 온라인 준비 중</small></button>
      <button data-act="customize">Customize</button>
      <button data-act="settings">Settings</button>
      <p class="ver">던지기 손맛 프로토타입 v0.1</p>
    </div>

    <!-- 멀티 설정 -->
    <div id="setup" class="panel setup hidden">
      <div class="panel-head">
        <b>멀티 (한 PC)</b>
        <button id="setupClose" class="icon">✕</button>
      </div>
      <div class="field">
        <span class="lbl">인원</span>
        <div class="seg" id="setupCount">
          <button data-n="2">2명</button><button data-n="3">3명</button><button data-n="4">4명</button>
        </div>
      </div>
      <div id="setupNames" class="names"></div>
      <div class="field">
        <span class="lbl">모드</span>
        <div class="seg" id="setupMode">
          <button data-mode="first">먼저 성공</button><button data-mode="last">꼴등 가리기</button>
        </div>
        <p id="setupModeDesc" class="info"></p>
      </div>
      <div class="field">
        <span class="lbl">목표 점수 <small>(이만큼 얻으면 성공)</small></span>
        <div class="stepper">
          <button id="targetMinus" aria-label="목표 점수 줄이기">−</button>
          <b id="targetVal">1</b>
          <button id="targetPlus" aria-label="목표 점수 늘리기">+</button>
        </div>
      </div>
      <label class="check"><input id="capDouble" type="checkbox" checked /> 뚜껑 착지는 2점</label>
      <button id="setupStart" class="primary">시작</button>
    </div>

    <!-- 멀티 결과 -->
    <div id="result" class="panel result hidden">
      <h2 id="resultTitle"></h2>
      <ol id="resultList"></ol>
      <div class="row">
        <button id="resultAgain" class="primary">다시 하기</button>
        <button id="resultMenu">메뉴</button>
      </div>
    </div>

    <!-- 커스터마이즈 / 맵 -->
    <div id="panel" class="panel hidden">
      <div class="panel-head">
        <b>커스터마이즈</b>
        <button id="panelClose" class="icon">✕</button>
      </div>
      <label>맵 <select id="map"></select></label>
      <label>병 <select id="bottle"></select></label>
      <label>유체 <select id="fluid"></select></label>
      <label>채운 양 <span id="fillVal"></span><input id="fill" type="range" min="0" max="100" step="5" /></label>
      <div class="row">
        <label>유체 색 <input id="fluidColor" type="color" /></label>
        <label>뚜껑 <input id="capColor" type="color" /></label>
      </div>
      <div class="row">
        <label>포장지 <select id="label"></select></label>
        <label>색 <input id="labelColor" type="color" /></label>
      </div>
      <p id="fluidInfo" class="info"></p>
    </div>

    <!-- 설정 / 튜닝 -->
    <div id="settings" class="panel hidden">
      <div class="panel-head">
        <b>설정 · 튜닝</b>
        <button id="settingsClose" class="icon">✕</button>
      </div>
      <label>드래그 감도 <span id="dragRefVal"></span><input id="dragRef" type="range" min="0.12" max="0.5" step="0.01" /></label>
      <label>기본 회전 <span id="spinBaseVal"></span><input id="spinBase" type="range" min="8" max="26" step="0.5" /></label>
      <label>속도 비례 회전 <span id="spinRatioVal"></span><input id="spinRatio" type="range" min="0" max="6" step="0.25" /></label>
      <label class="check"><input id="showMeter" type="checkbox" checked /> 파워 미터 표시</label>
      <label class="check"><input id="slowmo" type="checkbox" /> 슬로모션 (0.35x)</label>
      <button id="resetTuning">기본값으로</button>
    </div>

    <!-- 인게임 HUD -->
    <div id="hud" class="hud hidden">
      <div class="stats" id="practiceStats">
        <div><small>성공</small><b id="sOk">0</b>/<span id="sAll">0</span></div>
        <div><small>성공률</small><b id="sRate">-</b></div>
        <div><small>연속</small><b id="sStreak">0</b></div>
        <div><small>최고 연속</small><b id="sBest">0</b></div>
        <div><small>뚜껑</small><b id="sCaps">0</b></div>
      </div>
      <div class="scoreboard hidden" id="scoreboard"></div>
      <div class="turn-banner hidden" id="turnBanner"></div>
      <div class="hud-buttons">
        <button id="btnCustom">커스터마이즈</button>
        <button id="btnSettings">설정</button>
        <button id="btnMenu">메뉴</button>
      </div>
      <div id="meter" class="meter"><div id="meterFill"></div><div id="meterMark"></div></div>
      <div id="toast" class="toast"></div>
      <div id="last" class="last"></div>
      <div class="angle-box"><small>각도</small><b id="angle">6°</b><small>스크롤</small></div>
      <div class="hint">마우스로 병 옮기기 · <b>스크롤</b> 각도 · <b>누른 채 위로 끌어</b> 힘 모으고 놓기 · 우클릭 취소 · <b>R</b> 다시</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
